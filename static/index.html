<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gadget Hub Support</title>
<style>
body{font-family:system-ui,sans-serif;background:#f1f5f9;margin:0;display:flex;justify-content:center;padding:1.5rem}
#box{width:100%;max-width:560px;background:#fff;border-radius:12px;box-shadow:0 2px 12px #0002;display:flex;flex-direction:column;height:80vh}
header{padding:1rem;font-weight:700;border-bottom:1px solid #e2e8f0}
#log{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.6rem}
.m{max-width:80%;padding:.6rem .9rem;border-radius:12px;white-space:pre-wrap;line-height:1.4}
.user{align-self:flex-end;background:#2563eb;color:#fff}.bot{align-self:flex-start;background:#e2e8f0}
.src{font-size:.75rem;color:#64748b;margin-top:.3rem}
form{display:flex;gap:.5rem;padding:1rem;border-top:1px solid #e2e8f0}
input{flex:1;padding:.6rem;border:1px solid #cbd5e1;border-radius:8px}button{padding:.6rem 1rem;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}
</style></head><body>
<div id="box"><header>Gadget Hub Support</header><div id="log"></div>
<form id="f"><input id="q" placeholder="Ask about returns, shipping, stock..." autocomplete="off"><button>Send</button></form></div>
<script>
const log=document.getElementById("log"),q=document.getElementById("q"),history=[];
function add(text,cls,src){const d=document.createElement("div");d.className="m "+cls;d.textContent=text;
  if(src&&src.length){const s=document.createElement("div");s.className="src";s.textContent="Sources: "+src.join(", ");d.appendChild(s);}
  log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}
add("Hi! Ask me about returns, shipping, warranty, or whether a product is in stock.","bot");
document.getElementById("f").onsubmit=async e=>{
  e.preventDefault();const text=q.value.trim();if(!text)return;q.value="";
  add(text,"user");history.push({role:"user",content:text});const wait=add("...","bot");
  try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||"Error");
    wait.remove();add(d.reply,"bot",d.sources);history.push({role:"assistant",content:d.reply});
  }catch(err){wait.textContent=err.message;}
};
</script></body></html>
